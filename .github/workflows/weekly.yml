# Runs the whole weekly update and publishes the site.
# Every Wednesday at 5:00 UTC: midnight Eastern in the winter, 1 a.m. during daylight time.
# GitHub sometimes starts scheduled runs a little late. "Run workflow" on the Actions tab runs it any time.
name: Weekly refresh

on:
  schedule:
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: write      # to save the updated ESPN files back to the repo
  pages: write         # to publish the site
  id-token: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      # FantasyLuck's downloads (play-by-play and the rest) are big, so they live in GitHub's cache instead of the repo.
      # The first run downloads everything; later runs only refresh the current season.
      - name: Make the data folders
        run: mkdir -p FantasyLuck/data League/data site/almost_points

      - name: Restore FantasyLuck downloads
        uses: actions/cache@v4
        with:
          path: FantasyLuck/data
          key: fantasyluck-${{ github.run_id }}
          restore-keys: fantasyluck-

      - name: Run every notebook
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}     # only needed if the league ever goes private
          SWID: ${{ secrets.SWID }}
        run: jupyter execute --timeout=-1 run_all.ipynb

      - name: Save the updated ESPN files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add League/data/*.csv
          git diff --cached --quiet || git commit -m "Weekly refresh"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
